name: Auto Build & Release (나무 노트)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check and Auto-Bump Version if Release Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Current package.json version: v${CURRENT_VER}"

          if gh release view "v${CURRENT_VER}" >/dev/null 2>&1; then
            echo "Release v${CURRENT_VER} already exists. Auto-bumping patch version..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]"
            git push origin HEAD:main
            echo "Bumped version to v${NEW_VER}"
          else
            echo "Release v${CURRENT_VER} does not exist yet. Building v${CURRENT_VER}..."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bundle Default Google OAuth Config (if Secrets exist)
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            node -e '
              const fs = require("fs");
              fs.writeFileSync("oauth-defaults.json", JSON.stringify({
                clientId: (process.env.GOOGLE_OAUTH_CLIENT_ID || "").trim(),
                clientSecret: (process.env.GOOGLE_OAUTH_CLIENT_SECRET || "").trim()
              }), "utf8");
              console.log("Bundled oauth-defaults.json for built-in Google login.");
            '
          else
            echo "No GOOGLE_OAUTH_CLIENT_ID secret set; building without bundled OAuth defaults."
          fi

      - name: Build Installer
        run: npm run dist

      - name: Extract Latest Release Notes from CHANGELOG.md
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const ver = require("./package.json").version;
            let notes = "나무 노트 v" + ver + " 업데이트입니다.";
            if (fs.existsSync("CHANGELOG.md")) {
              const md = fs.readFileSync("CHANGELOG.md", "utf8");
              const m = md.match(/##\s+\[[^\]]+\][^\r\n]*[\r\n]+([\s\S]*?)(?=\r?\n##\s+\[|$)/);
              if (m && m[1].trim()) notes = m[1].trim();
            }
            fs.mkdirSync("dist", { recursive: true });
            fs.writeFileSync("dist/release-notes.md", notes, "utf8");
          '

      - name: Publish Installer to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          EXE_FILE="dist/TreeNote_Setup_${VER}.exe"
          BLOCKMAP_FILE="dist/TreeNote_Setup_${VER}.exe.blockmap"
          YML_FILE="dist/latest.yml"

          if [ ! -f "$EXE_FILE" ] || [ ! -f "$YML_FILE" ]; then
            echo "Required build artifacts missing in dist/:"
            ls -la dist/
            exit 1
          fi

          # 불완전하게 올라간 기존 릴리스(latest.yml 또는 .exe 누락) 정리
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            ASSETS=$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null || echo "")
            if ! echo "$ASSETS" | grep -q "latest.yml" && ! echo "$ASSETS" | grep -q "\.exe$"; then
              echo "Cleaning up incomplete release $tag..."
              gh release delete "$tag" --yes || true
            fi
          done

          # 현재 버전 릴리스가 이미 있으면 삭제 후 완전한 에셋으로 재생성
          if gh release view "v${VER}" >/dev/null 2>&1; then
            gh release delete "v${VER}" --yes || true
          fi

          gh release create "v${VER}" \
            "$EXE_FILE" \
            "$BLOCKMAP_FILE" \
            "$YML_FILE" \
            --title "나무 노트 v${VER}" \
            --notes-file dist/release-notes.md \
            --latest
