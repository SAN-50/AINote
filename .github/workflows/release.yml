name: Auto Build & Release (나무 노트)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve Release Version (No Reverse Push)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          EXISTING_TAGS=$(gh release list --limit 100 --json tagName -q '.[].tagName' || true)
          TARGET_VER=$(PKG_VER="$PKG_VER" EXISTING_TAGS="$EXISTING_TAGS" node -e '
            const parse = (s) => {
              const m = String(s || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const cmp = (a, b) => (a[0] - b[0]) || (a[1] - b[1]) || (a[2] - b[2]);
            const fmt = (v) => v.join(".");
            const pkg = parse(process.env.PKG_VER) || [1, 0, 0];
            const tags = (process.env.EXISTING_TAGS || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            const existingSet = new Set(tags.map(t => t.replace(/^v/, "")));
            let maxRel = null;
            for (const t of tags) {
              const p = parse(t);
              if (p && (!maxRel || cmp(p, maxRel) > 0)) maxRel = p;
            }
            let target = [...pkg];
            if (existingSet.has(fmt(target)) || (maxRel && cmp(target, maxRel) <= 0)) {
              const base = maxRel && cmp(maxRel, pkg) > 0 ? maxRel : pkg;
              target = [base[0], base[1], base[2] + 1];
              while (existingSet.has(fmt(target))) target[2] += 1;
            }
            process.stdout.write(fmt(target));
          ')
          echo "Resolved release version: v${TARGET_VER} (package.json was v${PKG_VER})"
          if [ "$TARGET_VER" != "$PKG_VER" ]; then
            npm version "$TARGET_VER" --no-git-tag-version --allow-same-version
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Installer
        run: npm run dist

      - name: Extract Latest Release Notes from CHANGELOG.md
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const ver = require("./package.json").version;
            let notes = "나무 노트 v" + ver + " 업데이트입니다.";
            if (fs.existsSync("CHANGELOG.md")) {
              const md = fs.readFileSync("CHANGELOG.md", "utf8");
              const m = md.match(/##\s+\[[^\]]+\][^\r\n]*[\r\n]+([\s\S]*?)(?=\r?\n##\s+\[|$)/);
              if (m && m[1].trim()) notes = m[1].trim();
            }
            fs.mkdirSync("dist", { recursive: true });
            fs.writeFileSync("dist/release-notes.md", notes, "utf8");
          '

      - name: Publish Installer to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          EXE_FILE="dist/TreeNote_Setup_${VER}.exe"
          BLOCKMAP_FILE="dist/TreeNote_Setup_${VER}.exe.blockmap"
          YML_FILE="dist/latest.yml"

          if [ ! -f "$EXE_FILE" ] || [ ! -f "$YML_FILE" ]; then
            echo "Required build artifacts missing in dist/:"
            ls -la dist/
            exit 1
          fi

          # 불완전하게 올라간 기존 릴리스(latest.yml 또는 .exe 누락) 정리
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            ASSETS=$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null || echo "")
            if ! echo "$ASSETS" | grep -q "latest.yml" && ! echo "$ASSETS" | grep -q "\.exe$"; then
              echo "Cleaning up incomplete release $tag..."
              gh release delete "$tag" --yes || true
            fi
          done

          # 현재 버전 릴리스가 이미 있으면 삭제 후 완전한 에셋으로 재생성
          if gh release view "v${VER}" >/dev/null 2>&1; then
            gh release delete "v${VER}" --yes || true
          fi

          gh release create "v${VER}" \
            "$EXE_FILE" \
            "$BLOCKMAP_FILE" \
            "$YML_FILE" \
            --target "${{ github.sha }}" \
            --title "나무 노트 v${VER}" \
            --notes-file dist/release-notes.md \
            --latest
