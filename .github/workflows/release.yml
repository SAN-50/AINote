name: Auto Build & Release (나무 노트)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check and Auto-Bump Version if Release Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          echo "Current package.json version: v${CURRENT_VER}"

          if gh release view "v${CURRENT_VER}" >/dev/null 2>&1; then
            echo "Release v${CURRENT_VER} already exists. Auto-bumping patch version..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]"
            git push origin HEAD:main
            echo "Bumped version to v${NEW_VER}"
          else
            echo "Release v${CURRENT_VER} does not exist yet. Building v${CURRENT_VER}..."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
